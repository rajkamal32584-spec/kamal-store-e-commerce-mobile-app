<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Order Success - Kamal Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 430px;
            margin: 0 auto;
            background: #f5f5f5;
        }
    </style>
</head>
<body class="relative min-h-screen pb-16">
    <main class="flex flex-col items-center justify-center h-screen p-6 text-center">
        <div class="bg-white p-8 rounded-xl shadow-sm max-w-sm w-full">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check" class="w-10 h-10 text-green-600"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Order Placed Successfully!</h1>
            <p class="text-gray-600 mb-6">Thank you for shopping with Kamal Store. Your order will be delivered soon.</p>
            <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                <p class="font-medium">Order ID: <span id="orderId" class="font-normal">#KAMAL12345</span></p>
                <p class="font-medium mt-2">Estimated Delivery: <span class="font-normal">2-3 business days</span></p>
            </div>
            <a href="index.html" class="block w-full bg-indigo-600 text-white py-3 rounded-lg font-medium">
                Continue Shopping
            </a>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        // Generate random order ID
        document.getElementById('orderId').textContent = '#KAMAL' + Math.floor(Math.random() * 100000);
    </script>
</body>
</html>
