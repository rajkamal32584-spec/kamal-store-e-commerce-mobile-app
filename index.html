<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kamal Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 430px;
            margin: 0 auto;
            background: #f5f5f5;
        }
    </style>
</head>
<body class="relative min-h-screen pb-16">
    <!-- Top App Bar -->
    <header class="sticky top-0 z-10 bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-600">Kamal Store</h1>
        <div class="flex gap-4">
            <i data-lucide="search" class="text-gray-600"></i>
            <i data-lucide="bell" class="text-gray-600"></i>
        </div>
    </header>

    <main class="p-4">
        <!-- Hero Section -->
        <div class="mb-6 rounded-xl overflow-hidden">
            <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80" 
                 alt="Special Offers" class="w-full h-40 object-cover rounded-lg">
        </div>

        <!-- Categories -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-6">
            <button class="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-full whitespace-nowrap">All Items</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">Electronics</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">Fashion</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">Home</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">Groceries</button>
        </div>

        <!-- Products Grid -->
        <h2 class="text-lg font-semibold mb-4">Popular Products</h2>
        <div class="grid grid-cols-2 gap-4">
            <!-- Product 1 -->
            <div class="bg-white rounded-xl p-3 shadow-sm">
                <img src="https://m.media-amazon.com/images/I/71TPda7cwUL._SL1500_.jpg" 
                     alt="Wireless Earbuds" class="w-full h-32 object-contain mb-2">
                <h3 class="font-medium text-sm">Boat Airdopes</h3>
                <p class="text-gray-500 text-xs">Wireless Earbuds</p>
                <p class="font-bold mt-1">₹1,299</p>
                <button class="w-full mt-2 bg-indigo-600 text-white py-1 rounded-lg text-sm" 
                        onclick="addToCart('Boat Airdopes', 1299, 'https://m.media-amazon.com/images/I/71TPda7cwUL._SL1500_.jpg')">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-xl p-3 shadow-sm">
                <img src="https://m.media-amazon.com/images/I/61L1ItFgFHL._SL1500_.jpg" 
                     alt="Smart Watch" class="w-full h-32 object-contain mb-2">
                <h3 class="font-medium text-sm">Noise ColorFit</h3>
                <p class="text-gray-500 text-xs">Smart Watch</p>
                <p class="font-bold mt-1">₹2,499</p>
                <button class="w-full mt-2 bg-indigo-600 text-white py-1 rounded-lg text-sm"
                        onclick="addToCart('Noise ColorFit', 2499, 'https://m.media-amazon.com/images/I/61L1ItFgFHL._SL1500_.jpg')">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white rounded-xl p-3 shadow-sm">
                <img src="https://m.media-amazon.com/images/I/61BGE6iu4AL._SL1500_.jpg" 
                     alt="Bluetooth Speaker" class="w-full h-32 object-contain mb-2">
                <h3 class="font-medium text-sm">JBL Go 3</h3>
                <p class="text-gray-500 text-xs">Speaker</p>
                <p class="font-bold mt-1">₹3,499</p>
                <button class="w-full mt-2 bg-indigo-600 text-white py-1 rounded-lg text-sm"
                        onclick="addToCart('JBL Go 3', 3499, 'https://m.media-amazon.com/images/I/61BGE6iu4AL._SL1500_.jpg')">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white rounded-xl p-3 shadow-sm">
                <img src="https://m.media-amazon.com/images/I/61nzj5gPqLL._SL1500_.jpg" 
                     alt="Power Bank" class="w-full h-32 object-contain mb-2">
                <h3 class="font-medium text-sm">Ambrane 10000mAh</h3>
                <p class="text-gray-500 text-xs">Power Bank</p>
                <p class="font-bold mt-1">₹899</p>
                <button class="w-full mt-2 bg-indigo-600 text-white py-1 rounded-lg text-sm"
                        onclick="addToCart('Ambrane Power Bank', 899, 'https://m.media-amazon.com/images/I/61nzj5gPqLL._SL1500_.jpg')">
                    Buy Now
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-white border-t flex justify-around py-3">
        <a href="index.html" class="flex flex-col items-center text-indigo-600">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Search</span>
        </a>
        <a href="cart.html" class="flex flex-col items-center text-gray-500 relative">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Cart</span>
            <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Profile</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        updateCartCount();
    </script>
</body>
</html>
