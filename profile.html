<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>My Profile - Kamal Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 430px;
            margin: 0 auto;
            background: #f5f5f5;
        }
    </style>
</head>
<body class="relative min-h-screen pb-16">
    <!-- Top App Bar -->
    <header class="sticky top-0 z-10 bg-white shadow-sm p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <a href="index.html">
                <i data-lucide="arrow-left" class="text-gray-600"></i>
            </a>
            <h1 class="text-xl font-bold text-indigo-600">My Profile</h1>
        </div>
        <div class="flex gap-4">
            <i data-lucide="settings" class="text-gray-600"></i>
        </div>
    </header>

    <main class="p-4">
        <!-- User Profile Section -->
        <div class="bg-white rounded-xl p-6 shadow-sm mb-6 flex flex-col items-center text-center">
            <div class="w-20 h-20 rounded-full bg-indigo-100 flex items-center justify-center mb-4">
                <i data-lucide="user" class="w-8 h-8 text-indigo-600"></i>
            </div>
            <h2 class="text-lg font-bold">Kamal Sharma</h2>
            <p class="text-gray-500 text-sm">kamal.sharma@example.com</p>
            <p class="text-gray-500 text-sm">+91 98765 43210</p>
            <button class="mt-4 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium">
                Edit Profile
            </button>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <button class="flex flex-col items-center p-3 bg-white rounded-lg shadow-sm">
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center mb-1">
                    <i data-lucide="package" class="w-5 h-5 text-indigo-600"></i>
                </div>
                <span class="text-xs">Orders</span>
            </button>
            <button class="flex flex-col items-center p-3 bg-white rounded-lg shadow-sm">
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center mb-1">
                    <i data-lucide="heart" class="w-5 h-5 text-indigo-600"></i>
                </div>
                <span class="text-xs">Wishlist</span>
            </button>
            <button class="flex flex-col items-center p-3 bg-white rounded-lg shadow-sm">
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center mb-1">
                    <i data-lucide="map-pin" class="w-5 h-5 text-indigo-600"></i>
                </div>
                <span class="text-xs">Addresses</span>
            </button>
            <button class="flex flex-col items-center p-3 bg-white rounded-lg shadow-sm">
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center mb-1">
                    <i data-lucide="help-circle" class="w-5 h-5 text-indigo-600"></i>
                </div>
                <span class="text-xs">Help</span>
            </button>
        </div>

        <!-- Recent Orders -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-semibold">Recent Orders</h2>
                <a href="#" class="text-indigo-600 text-sm">View All</a>
            </div>
            
            <div class="space-y-4">
                <!-- Order 1 -->
                <div class="border-b pb-4 last:border-0 last:pb-0">
                    <div class="flex justify-between mb-2">
                        <span class="text-sm font-medium">Order #KAMAL54231</span>
                        <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Delivered</span>
                    </div>
                    <div class="flex gap-3 mb-2">
                        <img src="https://m.media-amazon.com/images/I/71TPda7cwUL._SL1500_.jpg" 
                             alt="Product" class="w-12 h-12 object-contain rounded-lg">
                        <img src="https://m.media-amazon.com/images/I/61L1ItFgFHL._SL1500_.jpg" 
                             alt="Product" class="w-12 h-12 object-contain rounded-lg">
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>2 items</span>
                        <span class="font-medium">₹3,798</span>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button class="flex-1 py-2 border rounded-lg text-sm">Track</button>
                        <button class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm">Reorder</button>
                    </div>
                </div>

                <!-- Order 2 -->
                <div class="border-b pb-4 last:border-0 last:pb-0">
                    <div class="flex justify-between mb-2">
                        <span class="text-sm font-medium">Order #KAMAL48765</span>
                        <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full">Shipped</span>
                    </div>
                    <div class="flex gap-3 mb-2">
                        <img src="https://m.media-amazon.com/images/I/61BGE6iu4AL._SL1500_.jpg" 
                             alt="Product" class="w-12 h-12 object-contain rounded-lg">
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>1 item</span>
                        <span class="font-medium">₹3,499</span>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button class="flex-1 py-2 border rounded-lg text-sm">Track</button>
                        <button class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm">Reorder</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Account Settings -->
        <div class="bg-white rounded-xl p-4 shadow-sm">
            <h2 class="font-semibold mb-4">Account Settings</h2>
            <div class="space-y-3">
                <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i data-lucide="credit-card" class="w-4 h-4"></i>
                        </div>
                        <span class="text-sm">Payment Methods</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </a>
                <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                        </div>
                        <span class="text-sm">Saved Addresses</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </a>
                <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                        </div>
                        <span class="text-sm">Notifications</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </a>
                <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i data-lucide="help-circle" class="w-4 h-4"></i>
                        </div>
                        <span class="text-sm">Help Center</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </a>
                <button onclick="logout()" class="w-full flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg text-red-500">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </div>
                        <span class="text-sm">Log Out</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-white border-t flex justify-around py-3">
        <a href="index.html" class="flex flex-col items-center text-gray-500">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Search</span>
        </a>
        <a href="cart.html" class="flex flex-col items-center text-gray-500 relative">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Cart</span>
            <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-indigo-600">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-xs mt-1">Profile</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        updateCartCount();

        function logout() {
            // In a real app, this would clear auth tokens and redirect to login
            showToast('Logged out successfully');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
